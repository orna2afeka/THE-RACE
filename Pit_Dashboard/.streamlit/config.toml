# Streamlit config for the speed-profile builder (profile_builder.py), the only
# Streamlit app left in the repo. "Build Speed Profiles.bat" runs it from this
# folder, which is how Streamlit finds this file, and passes --server.port 8502.

[server]
# Don't try to launch a browser from the console window; the launcher opens one.
headless = true
# Nothing here edits source files while the builder is open, and the watcher
# costs CPU and can restart the app mid-session if a file is touched.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00ffcc"
